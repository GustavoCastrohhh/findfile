[package]
name = "rscover"
version = "0.1.0"
description = "Rscover – File Recovery Tool"
authors = ["Rscover contributors"]
edition = "2021"

[lib]
name = "rscover_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri             = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde             = { version = "1", features = ["derive"] }
serde_json        = "1"
md5               = "0.8"
memchr            = "2"
# Validação por decodificação real (arquivo que não abre é descartado)
image             = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
zip               = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
